<nav class="bg-main text-white shadow-md">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <a routerLink="/admin" class="text-xl font-bold">AlbumesMusica</a>

    <div class="flex flex-wrap items-center gap-4 text-sm">
      @if (authService.isAuthenticated()) {
        <span class="font-semibold">{{ authService.currentUser()?.name }}</span>
        <button
          type="button"
          (click)="logout()"
          class="bg-white text-main px-3 py-1 rounded font-semibold shadow-md hover:shadow-lg cursor-pointer"
        >
          Cerrar sesión
        </button>
      } @else {
        <a routerLink="/login" class="hover:underline">Iniciar sesión</a>
      }
    </div>
  </div>
</nav>
